name: Tina4Watch
options:
  bundleIdPrefix: com.tina4.pascal
  deploymentTarget:
    watchOS: "10.0"
targets:
  Tina4Watch:
    type: application
    platform: watchOS
    sources: [Tina4Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tina4.pascal.watchkitapp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Tina4 Watch"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGNING_ALLOWED: "NO"
