name: Tina4Watch
options:
  bundleIdPrefix: com.tina4.pascal
  deploymentTarget:
    watchOS: "10.0"
targets:
  Tina4Watch:
    type: application
    platform: watchOS
    sources: [Tina4Watch]
    info:
      path: Tina4Watch/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        CFBundleDisplayName: Tina4 Watch
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tina4.pascal.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGNING_ALLOWED: "NO"
