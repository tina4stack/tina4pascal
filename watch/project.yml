name: Tina4Watch
options:
  bundleIdPrefix: com.tina4.pascal
  deploymentTarget:
    watchOS: "10.0"
targets:
  Tina4Watch:
    type: application
    platform: watchOS
    sources:
      - Tina4Watch
    # The Pascal engine, built by `tools/tina4pascal build watchsim` into
    # app/libtina4watch.a (arm64 watchOS-sim). The app links it and calls the
    # tina4watch_* C entry points via Tina4Watch/tina4watch.h.
    dependencies:
      - framework: app/libtina4watch.a
        embed: false
    info:
      path: Tina4Watch/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        CFBundleDisplayName: Tina4 Watch
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tina4.pascal.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGNING_ALLOWED: "NO"
        # the Pascal engine (libtina4watch.a) is arm64-only (FPC watchossim = arm64),
        # so build the sim app arm64 too — Apple Silicon runs the watch sim natively.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "YES"
        # bridge to the Pascal engine's C ABI
        SWIFT_OBJC_BRIDGING_HEADER: Tina4Watch/tina4watch.h
        # the static lib lives in watch/app/
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/app
