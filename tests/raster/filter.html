<body style="margin:0;width:300px;height:220px;background:#fff">
  <div style="position:absolute;left:20px;top:20px;width:80px;height:80px;background:#2b41e6;filter:blur(4px)"></div>
  <div style="position:absolute;left:120px;top:20px;width:80px;height:80px;background:#ff5aa0;filter:grayscale(1)"></div>
  <div style="position:absolute;left:20px;top:120px;width:80px;height:80px;background:#2b41e6;filter:brightness(1.6)"></div>
  <div style="position:absolute;left:120px;top:120px;width:80px;height:80px;background:#ffd23c;filter:invert(1)"></div>
</body>
