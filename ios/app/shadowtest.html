<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#2b41e6; --pink:#ff5aa0; --yellow:#ffd23c; --ink:#15162e;
         --muted:#5b5c78; --paper:#fbfaf7; --surface:#fff; --border:#e6e5f0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;padding:22px}
  h1{font:800 26px "Gabarito",sans-serif;margin:0 0 4px}
  p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
  h2{font:700 13px "Gabarito",sans-serif;letter-spacing:.04em;text-transform:uppercase;
     color:var(--muted);margin:26px 0 12px}
  .grid{display:flex;gap:18px;flex-wrap:wrap}
  .card{width:150px;height:96px;background:var(--surface);border-radius:18px;
        display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted);font-size:13px}
  .s-soft   {box-shadow:0 8px 22px rgba(43,65,230,.28)}
  .s-strong {box-shadow:0 18px 40px rgba(21,22,46,.30)}
  .s-glow   {box-shadow:0 0 26px 2px rgba(255,90,160,.55)}
  .s-multi  {box-shadow:0 4px 10px rgba(43,65,230,.45), 0 16px 30px rgba(255,90,160,.35)}
  .s-inset  {box-shadow:inset 0 6px 16px rgba(21,22,46,.30)}
  .s-ring   {box-shadow:inset 0 0 0 5px var(--pink)}
  .row2{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .avatar{width:84px;height:84px;border-radius:50%;
          background:linear-gradient(135deg,var(--yellow),var(--pink),var(--blue));
          box-shadow:0 10px 24px rgba(21,22,46,.28)}
  .pill{height:52px;padding:0 26px;border-radius:999px;background:var(--blue);color:#fff;
        display:flex;align-items:center;font-weight:700;box-shadow:0 10px 22px rgba(43,65,230,.40)}
  .tag{padding:6px 14px;border-radius:12px;background:var(--yellow);color:#3a2c00;font-weight:700;font-size:13px;
       box-shadow:0 6px 14px rgba(255,210,60,.5)}
</style></head>
<body>
  <h1>Shadows &amp; radius</h1>
  <p class="sub">Rendered by Tina4Pascal — iOS software blur (DrawRGBA)</p>

  <h2>Drop · strong · glow · multiple</h2>
  <div class="grid">
    <div class="card s-soft">soft</div>
    <div class="card s-strong">strong</div>
    <div class="card s-glow">glow</div>
    <div class="card s-multi">two shadows</div>
  </div>

  <h2>Inset · inner ring</h2>
  <div class="grid">
    <div class="card s-inset">inset</div>
    <div class="card s-ring">inner ring</div>
  </div>

  <h2>Rounded · circle · pill</h2>
  <div class="row2">
    <div class="avatar"></div>
    <div class="pill">Continue</div>
    <div class="tag">NEW</div>
  </div>
</body></html>
