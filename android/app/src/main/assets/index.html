<!doctype html>
<html><head><style>
body{font-family:sans-serif;background:#fbfaf7;color:#15162e;margin:0;padding:22px}
h1{font-family:sans-serif;font-size:26px;margin:0 0 2px}
.sub{color:#5b5c78;margin:0 0 20px;font-size:14px}
h2{font-size:15px;margin:22px 0 10px}
.card{background:#fff;border:1px solid #e6e5f0;border-radius:16px;padding:16px;margin-bottom:14px}
.btn{background:#4F46E5;color:#fff;border-radius:11px;padding:12px 18px;display:inline-block;font-weight:bold}
.row{display:flex;gap:14px;align-items:center}
ul{margin:6px 0}
</style></head><body>
  <h1>Tina4Pascal on Android</h1>
  <p class="sub">Every pixel drawn by native Free Pascal → android.graphics.Canvas.</p>

  <div class="card">
    <h2 style="margin-top:0">Vector (SVG)</h2>
    <div class="row">
      <svg width="120" height="120" viewBox="0 0 100 100">
        <rect x="8" y="8" width="84" height="84" rx="14" fill="#4F46E5"/>
        <circle cx="50" cy="42" r="20" fill="#ffd23c"/>
        <path d="M25 78 Q50 55 75 78" fill="none" stroke="#ff5aa0" stroke-width="5"/>
      </svg>
      <svg width="120" height="120" viewBox="0 0 24 24">
        <path d="M12 21s-6.7-4.35-9.33-8.5C.9 9.6 2.2 6 5.5 6c1.9 0 3.4 1 4.5 2.4C11.1 7 12.6 6 14.5 6c3.3 0 4.6 3.6 2.83 6.5C18.7 16.65 12 21 12 21z"
              fill="#ff5aa0"/>
      </svg>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Text &amp; type</h2>
    <p>Regular, <b>bold</b>, <i>italic</i>, <u>underline</u>, <s>strike</s>,
       H<sub>2</sub>O and E=mc<sup>2</sup>.</p>
    <ul>
      <li>Bullet one</li>
      <li>Bullet two</li>
    </ul>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Controls</h2>
    <div class="row">
      <span class="btn">Primary</span>
      <span>Tap anything — events route through the native hit-test.</span>
    </div>
  </div>
</body></html>
