<!doctype html>
<html><head><style>
body{font-family:-apple-system,"Segoe UI",sans-serif;background:#f8f9fa;color:#212529;padding:24px;margin:0}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#6c757d;font-size:13px;margin:0 0 18px}
.row{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:#495057;margin-bottom:6px}
input[type=date]{font-size:15px;color:#212529}
</style></head><body>
  <h1>Date picker</h1>
  <p class="sub">A real calendar — formatted display, month navigation, today.</p>
  <div class="row">
    <label>Delivery date</label>
    <input type="date" value="2026-09-05" format="dd MMM yyyy">
  </div>
  <div class="row">
    <label>Start (empty + custom format)</label>
    <input type="date" format="MMMM d, yyyy" placeholder="Pick a start date">
  </div>
</body></html>
