<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Local preview</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #fff7ed; color: #431407; }
  h1 { margin-top: 0; font-size: 22px; }
  button { font-size: 16px; padding: 8px 16px; border-radius: 8px; border: 0; background: #ea580c; color: #fff; }
  .row { padding: 10px; border-bottom: 1px solid #fed7aa; }
</style>
</head>
<body>
  <h1>Served from http://127.0.0.1:8765</h1>
  <p>This page is rendered by the OS web view, with real JavaScript.</p>
  <p><button id="b">Clicked 0 times</button></p>
  <p><a href="second.html">Go to the second page</a></p>
  <div id="rows"></div>
  <script>
    let n = 0;
    const b = document.getElementById('b');
    b.onclick = () => { n++; b.textContent = 'Clicked ' + n + ' times'; };
    const rows = document.getElementById('rows');
    for (let i = 1; i <= 40; i++) {
      const d = document.createElement('div');
      d.className = 'row';
      d.textContent = 'Scrollable row ' + i;
      rows.appendChild(d);
    }
  </script>
</body>
</html>
