<h1 style="color:#2b41e6;margin:0 0 4px">Tina4Pascal on Windows</h1>
<p style="color:#5b5c78;margin:0 0 18px">Pure Free Pascal → GDI + DIB-section compositing, software gradients, GDI+ images.</p>

<h3 style="color:#15162e;margin:8px 0">Basic paint</h3>
<div style="display:flex;gap:14px">
  <div style="width:130px;height:80px;background:#2b41e6;border-radius:14px;color:#fff;text-align:center;line-height:80px">blue</div>
  <div style="width:130px;height:80px;background:#ff5aa0;border-radius:14px;color:#fff;text-align:center;line-height:80px">pink</div>
  <div style="width:130px;height:80px;background:#ffd23c;border-radius:14px;color:#15162e;text-align:center;line-height:80px">yellow</div>
</div>

<h3 style="color:#15162e;margin:18px 0 8px">gradients</h3>
<div style="display:flex;gap:14px">
  <div style="width:130px;height:80px;background:linear-gradient(#2b41e6, #ff5aa0);color:#fff;text-align:center;line-height:80px">vertical</div>
  <div style="width:130px;height:80px;background:linear-gradient(90deg, #2b41e6, #22d3a0);color:#fff;text-align:center;line-height:80px">90°</div>
  <div style="width:130px;height:80px;background:linear-gradient(135deg, #2b41e6, #ffd23c, #ff5aa0);color:#15162e;text-align:center;line-height:80px">3-stop</div>
  <div style="width:130px;height:80px;border-radius:16px;background:radial-gradient(#ffd23c, #ff5aa0);color:#15162e;text-align:center;line-height:80px">radial</div>
</div>

<h3 style="color:#15162e;margin:18px 0 8px">filter · blend · mask · 3D</h3>
<div style="display:flex;gap:14px;align-items:center">
  <div style="width:110px;height:80px;background:#2b41e6;filter:blur(5px)"></div>
  <div style="width:110px;height:80px;background:#ff5aa0;filter:drop-shadow(6px 8px 6px rgba(0,0,0,0.5))"></div>
  <div style="width:150px;height:80px;background:#ff5aa0;mask-image:linear-gradient(to right, black, transparent)"></div>
  <div style="width:110px;height:80px;background:#2b41e6;color:#fff;text-align:center;line-height:80px;transform:perspective(500px) rotateY(38deg)">3D</div>
</div>
