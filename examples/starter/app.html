<!doctype html>
<html><head><style>
  body{font-family:sans-serif;background:#fbfaf7;color:#15162e;
       padding:36px;text-align:center;margin:0}
  h1{font-size:64px;margin:0;color:#4f46e5}
  p{color:#5b5c78;margin:4px 0 20px}

  <h1>{{count}}</h1>
  <p>taps so far — persisted across restarts</p>

  <span class="btn2" onclick="App:Down()">–</span>
  <span class="btn"  onclick="App:Up()">+</span>
