<!-- overflow:hidden + border-radius must clip the child to the rounded shape -->
<body style="margin:0;background:#fff">
  <div style="position:absolute;left:30px;top:24px;width:240px;height:150px;
              border-radius:48px;overflow:hidden">
    <div style="width:100%;height:100%;background:#2b41e6"></div>
  </div>
</body>
