<!-- LTR words in an RTL paragraph: word order stays LTR (level-2 double reverse)
     but the line is right-aligned (RTL base) -->
<body style="margin:0;background:#fff;font-family:sans-serif">
  <div style="width:360px;direction:rtl;font-size:24px;color:#111;padding:8px">one two three</div>
</body>
