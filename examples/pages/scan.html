<!doctype html>
<html>
<head>
<style>
  /* Tina4 identity — electric blue on a dark scanner ground. Flex column:
     header · scanner · result. The <barcode-scanner> is itself the flex:1 box so
     it gets a real height (the shell needs a non-zero rect to start the camera);
     the shell overlays the live preview + a viewfinder over it. */
  body{ margin:0; color:#fff; background:#0e0f1f;
        font-family:"Gabarito","Hanken Grotesk",system-ui,sans-serif; }
  .screen{ display:flex; flex-direction:column; height:100vh; }

  .bar{ padding:18px 18px 14px; }
  .bar h1{ margin:0; font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .bar p{ margin:4px 0 0; font-size:13px; color:#a6a7c8; }

  /* explicit height: a <barcode-scanner> is a replaced element (intrinsic 0 h),
     so flex:1 won't stretch it — give it the viewport minus header + result. */
  barcode-scanner{ display:block; width:100%; height:calc(100vh - 190px); background:#000; }

  .result{ margin:16px; padding:16px; background:#16172c;
           border:1px solid #2a2c4c; border-radius:16px; }
  .result .label{ font-size:12px; color:#a6a7c8; }
  /* explicit bright colour — a dynamically-filled node must not fall back to
     dark text on the dark card; break long codes/URLs. */
  .result .value{ font-size:18px; font-weight:700; margin-top:3px;
                  color:#ffffff; word-break:break-all; }
</style>
</head>
<body>
<div class="screen">

  <div class="bar">
    <h1>Scan a code</h1>
    <p>Point the camera at a barcode or QR code</p>
  </div>

  <!-- the scanner: the shell overlays a live camera preview + a viewfinder here.
       On a decode the engine fills the element named by `result` and fires
       `onscan`. `formats` limits the symbologies. -->
  <barcode-scanner id="cam" formats="qr,ean13,code128"
                   result="#value" onscan="Scan:Result"></barcode-scanner>

  <div class="result">
    <div class="label">Last scan</div>
    <div class="value" id="value">—</div>
  </div>

</div>
</body>
</html>
