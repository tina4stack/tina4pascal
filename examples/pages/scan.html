<!doctype html>
<html>
<head>
<style>
  body { margin:0; font-family:'Segoe UI',Helvetica,sans-serif; color:#fff; }
  .screen { position:relative; width:100%; height:calc(100vh); background:#0e0f1a; }

  /* the live camera fills the screen; a shell overlays the preview on this box.
     On desktop/headless (no camera yet) it's just the black area. */
  barcode-scanner { position:absolute; left:0; top:0; width:100%; height:100%;
                    background:#000; }

  /* viewfinder: a centred rounded square the user aims the code into
     (positioned with explicit offsets — absolute top/left/width is honoured) */
  .frame  { position:absolute; top:270px; left:382px; width:260px; height:260px;
            border:4px solid #4F46E5; border-radius:22px; }

  .title  { position:absolute; top:26px; left:0; width:100%; text-align:center;
            font-size:20px; font-weight:bold; }
  .hint   { position:absolute; top:58px; left:0; width:100%; text-align:center;
            font-size:14px; color:#c8c8d8; }
  .torch  { position:absolute; top:20px; left:880px; width:110px; text-align:center;
            background:#181a2b; border:1px solid #2a2c40; border-radius:11px; padding:10px 0; }
  .result { position:absolute; top:700px; left:16px; width:960px;
            background:#181a2b; border:1px solid #2a2c40; border-radius:14px; padding:14px 16px; }
  .result .label { font-size:12px; color:#8a8ca6; }
  .result .value { font-size:18px; font-weight:bold; }
</style>
</head>
<body>
<div class="screen">

  <!-- the scanner: a shell overlays a live camera preview + decoder here; on a
       decode it fires onscan with the decoded value. `formats` limits the
       symbologies, `torch` requests the flashlight. -->
  <barcode-scanner id="cam" formats="qr,ean13,code128" torch
                   onscan="Scan:Result"></barcode-scanner>

  <div class="frame"></div>

  <div class="title">Scan a code</div>
  <div class="hint">Point the camera at a barcode or QR code</div>
  <span class="torch" onclick="Scan:Torch">Torch</span>

  <!-- the app's Scan:Result handler sets #value to the decoded text -->
  <div class="result">
    <div class="label">Last scan</div>
    <div class="value" id="value">—</div>
  </div>

</div>
</body>
</html>
