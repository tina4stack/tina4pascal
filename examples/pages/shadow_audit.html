<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#eef1f6;font:12px system-ui;padding:20px}
  h2{font-size:11px;margin:20px 0 10px;color:#555;text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;gap:34px;flex-wrap:wrap}
  .cell{width:120px}
  .lbl{font-size:10px;color:#777;margin-top:8px}
  .box{width:120px;height:70px;background:#fff;border-radius:10px}
  /* 1 basic drop */          .s1{box-shadow:0 6px 14px rgba(20,22,46,.35)}
  /* 2 large soft */          .s2{box-shadow:0 18px 40px rgba(43,65,230,.45)}
  /* 3 tight/hard */          .s3{box-shadow:0 2px 3px rgba(0,0,0,.6)}
  /* 4 spread + */            .s4{box-shadow:0 0 0 6px rgba(255,90,160,.9)}
  /* 5 offset+spread+blur */  .s5{box-shadow:8px 8px 12px 4px rgba(20,22,46,.4)}
  /* 6 glow (0 offset blur) */.s6{box-shadow:0 0 20px 2px rgba(43,65,230,.8)}
  /* 7 inset */               .s7{box-shadow:inset 0 4px 10px rgba(0,0,0,.5)}
  /* 8 inset spread */        .s8{box-shadow:inset 0 0 0 5px rgba(255,90,160,.9)}
  /* 9 multiple */            .s9{box-shadow:0 4px 8px rgba(43,65,230,.5), 0 12px 26px rgba(255,90,160,.4)}
  /* 10 pill shadow */        .s10{border-radius:999px;box-shadow:0 8px 18px rgba(20,22,46,.4)}
  /* 11 circle shadow */      .s11{width:80px;height:80px;border-radius:50%;box-shadow:0 10px 22px rgba(20,22,46,.45)}
  /* 12 negative spread */    .s12{box-shadow:0 12px 16px -6px rgba(0,0,0,.55)}
</style></head>
<body>
  <h2>drop · large · tight · spread</h2>
  <div class="row">
    <div class="cell"><div class="box s1"></div><div class="lbl">0 6 14</div></div>
    <div class="cell"><div class="box s2"></div><div class="lbl">0 18 40 soft</div></div>
    <div class="cell"><div class="box s3"></div><div class="lbl">0 2 3 hard</div></div>
    <div class="cell"><div class="box s4"></div><div class="lbl">spread 6 (ring)</div></div>
  </div>
  <h2>offset+spread · glow · negative spread · multiple</h2>
  <div class="row">
    <div class="cell"><div class="box s5"></div><div class="lbl">8 8 12 spread4</div></div>
    <div class="cell"><div class="box s6"></div><div class="lbl">glow</div></div>
    <div class="cell"><div class="box s12"></div><div class="lbl">neg spread -6</div></div>
    <div class="cell"><div class="box s9"></div><div class="lbl">two shadows</div></div>
  </div>
  <h2>inset · inset spread · pill · circle</h2>
  <div class="row">
    <div class="cell"><div class="box s7"></div><div class="lbl">inset</div></div>
    <div class="cell"><div class="box s8"></div><div class="lbl">inset ring</div></div>
    <div class="cell"><div class="box s10"></div><div class="lbl">pill</div></div>
    <div class="cell"><div class="box s11"></div><div class="lbl">circle</div></div>
  </div>
</body></html>
