<!doctype html>
<html><head><style>
  html,body{height:100%;margin:0}
  body{background:#0e0f1f;color:#ececfb;font-family:Helvetica;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;overflow:hidden}
  .eyebrow{font-size:12px;letter-spacing:2px;color:#7d8cff;margin-bottom:8px}
  .icon{width:92px;height:92px;border-radius:50%;background:#331a2a;
        display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:44px}
  .status{font-size:22px;font-weight:bold;color:#ff7ab4}
  .detail{font-size:13px;color:#a6a7c8;margin-top:3px}
  .time{font-size:12px;color:#6a6c90;margin-top:12px}
</style></head><body>
  <div class="eyebrow">TINA4 · MONITOR</div>
  <div class="icon">🔊</div>
  <div class="status" id="status">Noise detected</div>
  <div class="detail" id="detail">68 dB · living room</div>
  <div class="time" id="time">14:32</div>
</body></html>
